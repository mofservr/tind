# Tind: servr.no tunnel defaults. Shell syntax, no spaces around "=".
# The server's endpoint, public key, subnet and DNS server are NOT in the image: they arrive in the
# enrolment block the server admin sends back to each device (see `tind-enroll apply`).
# A block may also carry DNS_DOMAIN and KEEPALIVE, which then override the values below.

# names under this domain resolve through the tunnel
DNS_DOMAIN="servr.no"
# keeps NAT mappings alive so the tunnel survives idle periods
KEEPALIVE="25"
# NetworkManager connection / interface name (max 15 characters)
CONNECTION_NAME="tind-servr"
