# Tind: servr.no tunnel settings. Shell syntax, no spaces around "=".
# Filled in once by whoever runs the server. tind-enroll refuses to run while
# the first four values are empty. Nothing here is secret.

# host:port of the server's WireGuard endpoint
SERVER_ENDPOINT=""
# the server's WireGuard public key
SERVER_PUBLIC_KEY=""
# ONLY the server-side subnet(s) to reach through the tunnel, comma separated,
# for example 10.8.0.0/24. Never 0.0.0.0/0: this is a split tunnel.
ALLOWED_IPS=""
# DNS server reachable inside the tunnel (usually the server's tunnel address)
DNS_SERVER=""

# names under this domain resolve through the tunnel
DNS_DOMAIN="servr.no"
# keeps NAT mappings alive so the tunnel survives idle periods
KEEPALIVE="25"
# NetworkManager connection / interface name (max 15 characters)
CONNECTION_NAME="tind-servr"
