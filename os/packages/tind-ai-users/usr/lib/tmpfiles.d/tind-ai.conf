# Tind AI box folders (tind-ai-users). The per-user folders below briefing/ and outbox/ are made by the services.
# 0711: the humans and the other AI user can pass through to their own folder, nobody can list who has one.
d /var/lib/tind-ai           0755 root           root           -
d /var/lib/tind-ai/briefing  0711 tind-ai-local  tind-ai-local  -
d /var/lib/tind-ai/outbox    0711 tind-ai-remote tind-ai-remote -
d /var/lib/tind-ai/local     0700 tind-ai-local  tind-ai-local  -
d /etc/tind-ai               0755 root           root           -
d /etc/tind-ai/keys          0700 root           root           -
d /run/tind-ai               0755 root           root           -
