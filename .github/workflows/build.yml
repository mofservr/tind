name: build
on:
  push:
    branches-ignore: [ci-logs]
    paths-ignore: ['docs/**', 'README.md', 'os/ci/installer-test/**', 'os/ci/drive.py', '.github/workflows/installer-test.yml']
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  packages:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates dpkg-dev shellcheck libxml2-utils jq xz-utils sudo
      - uses: actions/checkout@v4
      - name: Lint, build packages, check package names
        run: |
          mkdir -p logs
          {
            echo "== bash -n and shellcheck (warnings and errors)"
            files=$(grep -rIl '^#!.*\(ba\)\?sh' os | sort)
            rc=0
            for f in $files; do bash -n "$f" || rc=1; done
            # shellcheck disable=SC2086
            shellcheck -x -S warning $files || rc=1
            echo "== JSON and XML"
            find os -name '*.json' -print0 | xargs -0 -r -n1 jq empty || rc=1
            find os -name '*.xml' -print0 | xargs -0 -r -n1 xmllint --noout || rc=1
            echo "== build .deb packages"
            os/packages/build-debs.sh || rc=1
            echo "== package names exist in trixie (with contrib, non-free, non-free-firmware)"
            for f in /etc/apt/sources.list.d/*.sources; do
              sed -i 's/^Components: .*/Components: main contrib non-free non-free-firmware/' "$f"
            done
            apt-get update >/dev/null
            os/scripts/check-packages.sh || rc=1
            echo "== gaming and graphics candidates"
            dpkg --add-architecture i386; apt-get update >/dev/null
            for p in nvidia-driver nvidia-detect nvidia-driver-libs nvidia-driver-libs-i386 nvidia-vulkan-icd nvidia-kernel-dkms nvidia-open-kernel-dkms nvidia-settings nvidia-tesla-470-driver nvidia-legacy-390xx-driver linux-headers-amd64 dkms game-devices-udev steam-devices steam-installer lutris gamemode mangohud wine wine32 libgl1-mesa-dri:i386 mesa-vulkan-drivers:i386 libvulkan1:i386 vulkan-tools mesa-utils libva-drm2 intel-media-va-driver-non-free mesa-va-drivers mesa-vdpau-drivers firmware-amd-graphics goverlay gamescope vkbasalt protontricks winetricks zenity; do
              echo "-- $p: $(apt-cache policy $p 2>/dev/null | sed -n 's/^  Candidate: //p')"
            done
            echo "== nvidia-driver depends/recommends"
            apt-cache depends nvidia-driver
            echo "== flathub refs"
            apt-get install -y flatpak >/dev/null 2>&1
            flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak remote-ls --system flathub --columns=ref 2>&1 | grep -E 'com.valvesoftware.Steam|net.lutris.Lutris|com.heroicgameslauncher.hgl|net.davidotek.pupgui2|VulkanLayer|GL32?.nvidia-550|com.github.Matoking.protontricks|io.github.benjamimgois.goverlay|com.spotify.Client|com.bitwarden.desktop|org.gnome.(Calendar|Contacts|Weather|Maps|clocks|baobab|Logs|font-viewer|Characters|SimpleScan|Connections)$' | sort | head -80
            echo "== lutris depends/recommends"
            apt-cache depends lutris || true
            echo "== verify-on-debian (informational)"
            os/scripts/verify-on-debian.sh || true
            echo "== exit status: $rc"
            exit $rc
          } 2>&1 | tee logs/packages.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-logs
          path: logs/
      - uses: actions/upload-artifact@v4
        with:
          name: tind-debs
          path: os/dist/*.deb
          retention-days: 3

  iso:
    if: ${{ !contains(github.event.head_commit.message, '[skip iso]') }}
    needs: packages
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools git ca-certificates dpkg-dev sudo gnupg curl
      - uses: actions/checkout@v4
      - name: Build ISO (no Proton repo yet)
        env:
          TIND_PROTON: "0"
          TIND_CI: "1"
        run: |
          mkdir -p logs
          { echo '== live-build bootloader templates'; find /usr/share/live/build/bootloaders -maxdepth 3 | sort; \
            echo '== grub-pc theme.txt'; cat /usr/share/live/build/bootloaders/grub-pc/live-theme/theme.txt; \
            echo '== grub-pc grub.cfg'; cat /usr/share/live/build/bootloaders/grub-pc/grub.cfg; } > logs/bootloader-templates.log 2>&1 || true
          ( while sleep 20; do echo "RES $(date +%T) $(df -h / | tail -1 | awk '{print "disk-used="$3" avail="$4}') $(free -m | awk 'NR==2{print "mem-used="$3"M avail="$7"M"}') $(free -m | awk 'NR==3{print "swap-used="$3"M"}')"; done ) &
          os/build.sh 2>&1 | tee logs/iso-build.log
      - name: Collect live-build logs
        if: always()
        run: |
          mkdir -p logs
          cp os/build/chroot.log logs/ 2>/dev/null || true
          cp os/build/*.log logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-logs
          path: logs/
      - uses: actions/upload-artifact@v4
        with:
          name: tind-iso
          path: os/build/*.iso
          retention-days: 3
          compression-level: 0

  boot:
    if: ${{ !contains(github.event.head_commit.message, '[skip iso]') }}
    needs: iso
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tind-iso
          path: iso
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf socat imagemagick
      - name: Boot the ISO (UEFI) and take screenshots
        run: |
          mkdir -p logs shots
          {
            ls -l iso
            [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm
            if [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; echo "KVM: yes"; else ACCEL="-cpu max"; echo "KVM: no (TCG, slow)"; fi
            ISO=$(ls $PWD/iso/*.iso | head -1)
            cp /usr/share/OVMF/OVMF_VARS_4M.fd $PWD/vars.fd
            qemu-system-x86_64 $ACCEL -machine q35 -m 4096 -smp 2 \
              -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
              -drive if=pflash,format=raw,file=$PWD/vars.fd \
              -smbios type=1,product=tind-ci -cdrom "$ISO" -boot d -vga std -display none -serial file:$PWD/logs/serial.log \
              -monitor unix:$PWD/mon.sock,server,nowait -daemonize -pidfile $PWD/qemu.pid
            sleep 30
            echo "sendkey ret" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || echo "sendkey failed"
            for i in $(seq 1 14); do
              sleep 45
              echo "screendump $PWD/shots/t$(printf %02d "$i").ppm" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || echo "monitor gone at $i"
              sleep 1
              if [ -f "shots/t$(printf %02d "$i").ppm" ]; then convert "shots/t$(printf %02d "$i").ppm" "logs/boot-t$(printf %02d "$i").png"; fi
            done
            echo quit | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || true
            ls -l logs
          } 2>&1 | tee logs/boot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-logs
          path: logs/

  publish-logs:
    # Actions log downloads are not reachable from Claude's workspace, so push the logs to a branch.
    needs: [packages, iso, boot]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-logs'
          path: collected
          merge-multiple: true
      - name: Push logs to ci-logs branch
        env:
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN: ${{ github.run_id }}
          RESULTS: "packages=${{ needs.packages.result }} iso=${{ needs.iso.result }} boot=${{ needs.boot.result }}"
        run: |
          set -eu
          git clone --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out 2>/dev/null \
            || { git init -q out; git -C out checkout -q -b ci-logs; git -C out remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
          d="out/${GH_REF//\//_}"
          rm -rf "$d"; mkdir -p "$d"
          for f in collected/*.log; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            tail -n 400 "$f" > "$d/$b.tail"
            gzip -9 -c "$f" > "$d/$b.gz"
          done
          cp collected/*.png "$d/" 2>/dev/null || true
          printf 'ref: %s\nsha: %s\nrun: %s\nresults: %s\n' "$GH_REF" "$GH_SHA" "$GH_RUN" "$RESULTS" > "$d/STATUS"
          cd out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "logs for $GH_REF $GH_SHA ($RESULTS)" || true
          git push origin ci-logs
