name: build
on:
  push:
  workflow_dispatch:

jobs:
  packages:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates dpkg-dev shellcheck libxml2-utils jq xz-utils sudo
      - uses: actions/checkout@v4
      - name: bash -n and shellcheck
        run: |
          set -e
          files=$(grep -rIl '^#!.*\(ba\)\?sh' os --exclude-dir=.git | sort)
          for f in $files; do bash -n "$f"; done
          shellcheck -x $files
      - name: JSON and XML
        run: |
          find os -name '*.json' -print0 | xargs -0 -n1 jq empty
          find os -name '*.xml' -print0 | xargs -0 -r -n1 xmllint --noout
      - name: Build .deb packages
        run: os/packages/build-debs.sh
      - name: Package names exist in trixie
        run: |
          apt-get update
          os/scripts/check-packages.sh 2>&1 | tee check-packages.log
      - name: verify-on-debian (informational)
        run: os/scripts/verify-on-debian.sh 2>&1 | tee verify.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-logs
          path: |
            *.log
            os/dist/*.deb

  iso:
    needs: packages
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools git ca-certificates dpkg-dev sudo gnupg curl
      - uses: actions/checkout@v4
      - name: Build ISO (no Proton repo yet)
        env:
          TIND_PROTON: "0"
        run: os/build.sh 2>&1 | tee iso-build.log
      - name: Collect live-build logs
        if: always()
        run: |
          mkdir -p logs
          cp iso-build.log logs/ 2>/dev/null || true
          cp os/build/chroot.log os/build/*.log logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-logs
          path: logs/
      - uses: actions/upload-artifact@v4
        with:
          name: tind-iso
          path: os/build/*.iso
          retention-days: 3
