name: build
on:
  push:
    branches-ignore: [ci-logs]
    paths-ignore: ['docs/**', 'README.md', 'os/ci/installer-test/**', 'os/ci/drive.py', '.github/workflows/installer-test.yml']
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  packages:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates dpkg-dev apt-utils gnupg shellcheck libxml2-utils jq xz-utils sudo curl pciutils pci.ids
      - uses: actions/checkout@v4
      - name: Lint, build packages, check package names
        run: |
          mkdir -p logs
          {
            echo "== bash -n and shellcheck (warnings and errors)"
            files=$(grep -rIl '^#!.*\(ba\)\?sh' os | sort)
            rc=0
            for f in $files; do bash -n "$f" || rc=1; done
            # shellcheck disable=SC2086
            shellcheck -x -S warning $files || rc=1
            echo "== JSON and XML"
            find os -name '*.json' -print0 | xargs -0 -r -n1 jq empty || rc=1
            find os -name '*.xml' -print0 | xargs -0 -r -n1 xmllint --noout || rc=1
            echo "== build .deb packages"
            os/packages/build-debs.sh || rc=1
            echo "== apt repository publisher: promotion rules, signing, real apt against the result"
            os/scripts/test-publish-apt.sh || rc=1
            echo "== GPU fallback for old NVIDIA cards"
            os/scripts/test-gpu-check.sh || rc=1
            echo "== package names exist in trixie (with contrib, non-free, non-free-firmware)"
            for f in /etc/apt/sources.list.d/*.sources; do
              sed -i 's/^Components: .*/Components: main contrib non-free non-free-firmware/' "$f"
            done
            apt-get update >/dev/null
            os/scripts/check-packages.sh || rc=1
            echo "== firmware in trixie that Tind does not list (informational)"
            listed="$(os/scripts/check-packages.sh --list | grep -E '^firmware-' | sort -u)"
            apt-cache search --names-only '^firmware-' | awk '{print $1}' | sort -u | comm -23 - <(echo "$listed") || true
            echo "-- firmware-misc-nonfree depends on:"; apt-cache depends firmware-misc-nonfree 2>&1 | grep -E 'Depends|Recommends' || true
            echo "== login screen: how Debian builds it (informational)"
            (mkdir -p /tmp/gdmx && cd /tmp/gdmx && apt-get download gdm3 desktop-base gnome-shell >/dev/null 2>&1
             for d in gdm3_*.deb desktop-base_*.deb gnome-shell_*.deb; do echo "-- $d"; dpkg-deb -c "$d" | awk '{print $6}' | grep -iE "gdm|login|greeter|gresource|desktop-base/(active|.*theme)/(login|gnome)" | head -40; done
             dpkg-deb -x gdm3_*.deb g; dpkg-deb -e gdm3_*.deb gc; dpkg-deb -e desktop-base_*.deb dc; dpkg-deb -x desktop-base_*.deb db
             echo "-- greeter dconf defaults"; cat g/usr/share/gdm/greeter.dconf-defaults g/etc/gdm3/greeter.dconf-defaults 2>/dev/null | grep -v '^$' | head -60
             echo "-- dconf profile"; cat g/etc/dconf/profile/gdm g/usr/share/dconf/profile/gdm 2>/dev/null
             echo "-- alternatives in maintainer scripts"; grep -hn "alternatives\|gresource\|login" gc/postinst dc/postinst dc/preinst 2>/dev/null | head -30
             echo "-- how the GDM background is chosen"
             apt-get install -y --no-install-recommends libglib2.0-bin >/dev/null 2>&1; command -v gresource || echo 'gresource tool missing'
             apt-get download gnome-shell-common >/dev/null 2>&1; dpkg-deb -x gnome-shell-common_*.deb gs
             for r in $(find gs -name '*.gresource'); do echo "gresource: $r"; gresource list "$r" 2>/dev/null | grep -iE "gdm|login|background" | head; gresource extract "$r" /org/gnome/shell/theme/gdm.css 2>/dev/null | grep -nE "lockDialogGroup|background|url" | head -12; done
             for c in gnome-shell-dark.css gnome-shell-light.css; do echo "-- $c lockDialogGroup"; gresource extract gs/usr/share/gnome-shell/gnome-shell-theme.gresource /org/gnome/shell/theme/$c 2>&1 | grep -n -B1 -A6 'lockDialogGroup' | head -30; done
             grep -rlE "login-background|desktop-base" g gc gs 2>/dev/null | head
             grep -rn "background" g/usr/share/gdm/*.dconf* g/etc/gdm3/* 2>/dev/null | head -5
             echo "-- desktop-base login files"; find db -ipath '*login*' | head; find db -name '*.gresource*' | head) || true
            echo "== calamares stock config"
            mkdir -p /tmp/cal && cd /tmp/cal && apt-get download calamares-settings-debian calamares >/dev/null 2>&1
            for d in *.deb; do dpkg -x "$d" x; done
            cat x/etc/calamares/settings.conf
            echo "-- calamares version: $(dpkg-deb -f calamares_*.deb Version)"
            find x -name 'packagechooser*' -o -name 'shellprocess*' | head || true
            cat x/usr/share/calamares/modules/packagechooser.conf 2>/dev/null | head -80 || true
            ls x/usr/lib/*/calamares/modules 2>/dev/null | tr '\n' ' ' || true; echo
            cd "$GITHUB_WORKSPACE"
            echo "== calamares-settings-debian files and bootloader config"
            dpkg-deb -c /tmp/cal/calamares-settings-debian_*.deb | awk '{print $6}' | grep -v '/$' | head -60 || true
            cat /tmp/cal/x/etc/calamares/modules/bootloader.conf 2>&1 | grep -v '^#' | grep -v '^$' | head -40 || true
            for f in $(grep -rl 'grub' /tmp/cal/x/usr/sbin /tmp/cal/x/usr/bin /tmp/cal/x/usr/lib/calamares 2>/dev/null | head -4); do echo "-- $f"; cat "$f" | head -80; done || true
            grep -v '^#' /tmp/cal/x/etc/calamares/modules/packages.conf 2>&1 | grep -v '^$' | head -30 || true
            echo "== calamares bootloader helper"
            cat /tmp/cal/x/usr/share/calamares/helpers/calamares-bootloader-config 2>&1 | head -80 || true
            cat /tmp/cal/x/usr/lib/calamares/modules/bootloader-config/module.desc 2>&1 | head -20 || true
            echo "== backports kernel and nvidia"
            echo "deb http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware" > /etc/apt/sources.list.d/bp.list
            apt-get update >/dev/null 2>&1 || true
            for p in linux-image-amd64 linux-headers-amd64 nvidia-kernel-dkms nvidia-driver os-prober grub-pc-bin; do
              echo "-- $p: stable=$(apt-cache policy $p | sed -n 's/^  Candidate: //p') backports=$(apt-cache policy $p | grep -B1 'trixie-backports' | head -1 | awk '{print $1}')"
            done
            apt-cache policy linux-image-amd64 | head -12 || true
            echo "== calamares QML module examples"
            for m in packagechooserq welcomeq; do echo "-- $m/module.desc"; cat /tmp/cal/x/usr/lib/x86_64-linux-gnu/calamares/modules/$m/module.desc 2>&1 | head -20; done || true
            find /tmp/cal/x -name '*.qml' | head -30 || true
            find /tmp/cal/x -path '*calamares/modules/*' -name '*.conf' | head -40 || true
            echo "-- packagechooserq.conf"; cat /tmp/cal/x/usr/share/calamares/modules/packagechooserq.conf 2>&1 | head -60 || true
            echo "-- an example qml (packagechooserq)"; cat $(find /tmp/cal/x -name 'packagechooserq.qml' | head -1) 2>&1 | head -120 || true
            echo "== microsoft repo reachable"
            curl -sI https://packages.microsoft.com/keys/microsoft.asc | head -3 || true
            curl -sI https://packages.microsoft.com/repos/code/dists/stable/InRelease | head -3 || true
            echo "== gaming and graphics candidates"
            dpkg --add-architecture i386; apt-get update >/dev/null
            for p in nvidia-driver nvidia-detect nvidia-driver-libs nvidia-driver-libs-i386 nvidia-vulkan-icd nvidia-kernel-dkms nvidia-open-kernel-dkms nvidia-settings nvidia-tesla-470-driver nvidia-legacy-390xx-driver linux-headers-amd64 dkms game-devices-udev steam-devices steam-installer lutris gamemode mangohud wine wine32 libgl1-mesa-dri:i386 mesa-vulkan-drivers:i386 libvulkan1:i386 vulkan-tools xpadneo-dkms xone-dkms vlc strawberry gimp inkscape krita kdenlive frei0r-plugins breeze-icon-theme audacity obs-studio blender telegram-desktop libreoffice-writer libreoffice-calc libreoffice-impress libreoffice-gtk3 libreoffice-l10n-nb libreoffice-l10n-nn hunspell-no myspell-nb nextcloud-desktop hplip sane-utils sane-airscan wireshark nmap mtr remmina remmina-plugin-rdp remmina-plugin-vnc remmina-plugin-secret virt-manager libvirt-daemon-system qemu-system-x86 mesa-utils libva-drm2 intel-media-va-driver-non-free mesa-va-drivers mesa-vdpau-drivers firmware-amd-graphics goverlay gamescope vkbasalt protontricks winetricks zenity; do
              echo "-- $p: $(apt-cache policy $p 2>/dev/null | sed -n 's/^  Candidate: //p')"
            done
            echo "== nvidia-driver depends/recommends"
            apt-cache depends nvidia-driver
            echo "== flathub refs"
            apt-get install -y flatpak >/dev/null 2>&1
            flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak remote-ls --system flathub --columns=ref 2>&1 | grep -E 'com.valvesoftware.Steam|net.lutris.Lutris|net.davidotek.pupgui2|VulkanLayer|GL32?.nvidia-550|com.github.Matoking.protontricks|io.github.benjamimgois.goverlay|com.spotify.Client|com.bitwarden.desktop|org.gnome.(Calendar|Contacts|Weather|Maps|clocks|baobab|Logs|font-viewer|Characters|SimpleScan|Connections)$' | sort | head -80
            echo "== flatpak runtimes of game apps"
            for a in com.valvesoftware.Steam net.lutris.Lutris; do
              echo "-- $a: $(flatpak remote-info --system flathub $a 2>&1 | grep -i 'runtime' | head -2 | tr '\n' ' ')"
            done
            echo "== Flatpak refs used by the app-box scripts exist on Flathub"
            for r in com.discordapp.Discord net.davidotek.pupgui2 com.spotify.Client com.bitwarden.desktop org.telegram.desktop org.strawberrymusicplayer.strawberry; do
              if flatpak remote-info --system flathub "$r" >/dev/null 2>&1; then echo "ok       $r"; else echo "MISSING  $r"; fi
            done
            echo "== every opt-in Flatpak ref exists on Flathub"
            for f in os/packages/tind-optins/usr/share/tind/optins.d/*.optin; do
              ( FLATPAK_REF=""; . "$f"; for r in $FLATPAK_REF; do
                  if flatpak remote-info --system flathub "$r" >/dev/null 2>&1; then echo "ok       $r"; else echo "MISSING  $r ($(basename $f))"; fi
                done )
            done
            echo "== lutris depends/recommends"
            apt-cache depends lutris || true
            echo "== newer kernel: dry run"
            apt-get install -y ./os/dist/tind-extras_*_all.deb >/dev/null 2>&1 || true
            TIND_DRYRUN=1 /usr/lib/tind/setup-newer-kernel 2>&1 | grep -E "^Inst (linux-image|linux-headers|nvidia)|^E:|setup done|Remv" | head -12 || true
            echo "== tind-extras: real run of the setup scripts"
            apt-get install -y ./os/dist/tind-extras_*_all.deb >/dev/null 2>&1 || { echo "tind-extras install FAILED"; rc=1; }
            /usr/lib/tind/setup-dev > logs/setup-dev.log 2>&1 && echo "setup-dev: OK" || { echo "setup-dev: FAILED"; tail -25 logs/setup-dev.log; rc=1; }
            /usr/lib/tind/setup-gaming > logs/setup-gaming.log 2>&1 && echo "setup-gaming: OK" || { echo "setup-gaming: FAILED"; tail -25 logs/setup-gaming.log; rc=1; }
            # the runner container has no systemd; some post-install scripts (Proton VPN daemon) call systemctl and fail
            # (diverted at /usr/bin so absolute /bin/systemctl calls are caught too; put back after the loop)
            dpkg-divert --local --rename --add /usr/bin/systemctl >/dev/null
            printf '#!/bin/sh\nexit 0\n' > /usr/bin/systemctl && chmod +x /usr/bin/systemctl
            printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d && chmod +x /usr/sbin/policy-rc.d
            for box in entertainment communication productivity hardware security; do
              /usr/lib/tind/setup-$box > logs/setup-$box.log 2>&1 && echo "setup-$box: OK" || { echo "setup-$box: FAILED"; tail -25 logs/setup-$box.log; rc=1; }
            done
            rm -f /usr/bin/systemctl /usr/sbin/policy-rc.d; dpkg-divert --local --rename --remove /usr/bin/systemctl >/dev/null
            echo "== creative: simulated install only (a full install is too large for the runner)"
            apt-get install -s gimp inkscape krita kdenlive frei0r-plugins breeze-icon-theme audacity obs-studio blender >/dev/null 2>&1 && echo "setup-creative packages: OK (simulated)" || { echo "setup-creative packages: FAILED"; rc=1; }
            echo "== app boxes: things to check by eye"
            grep -E "Signal apt signing key|WARNING|NOTE:" logs/setup-*.log | head -20 || true
            cat /etc/apt/sources.list.d/signal-desktop.sources 2>&1 | head -10 || true
            flatpak list --system --columns=application 2>&1 | head -20 || true
            dpkg-query -W -f='${Package} ${Version} ${db:Status-Abbrev}\n' vlc strawberry telegram-desktop signal-desktop libreoffice-writer nextcloud-desktop hplip sane-utils sane-airscan wireshark nmap mtr remmina virt-manager xpadneo-dkms xone-dkms 2>&1 | head -30 || true
            dpkg-query -W -f='${Package} ${Version} ${db:Status-Abbrev}\n' git gh code steam-installer lutris wine wine32:i386 winetricks gamemode mangohud steam-devices 2>&1 | head -20 || true
            code --version --no-sandbox --user-data-dir /tmp/codetest 2>&1 | head -2 || true
            ls /etc/apt/sources.list.d/ ; cat /etc/apt/sources.list.d/vscode.sources
            cat /etc/sysctl.d/99-tind-gaming.conf
            echo "== verify-on-debian (informational)"
            os/scripts/verify-on-debian.sh || true
            echo "== exit status: $rc"
            exit $rc
          } 2>&1 | tee logs/packages.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-logs
          path: logs/
      - uses: actions/upload-artifact@v4
        with:
          name: tind-debs
          path: os/dist/*.deb
          retention-days: 3

  iso:
    if: ${{ !contains(github.event.head_commit.message, '[skip iso]') }}
    needs: packages
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools git ca-certificates dpkg-dev sudo gnupg curl
      - uses: actions/checkout@v4
      - name: Build ISO
        env:
          TIND_CI: "1"
        run: |
          mkdir -p logs
          { echo '== live-build bootloader templates'; find /usr/share/live/build/bootloaders -maxdepth 3 | sort; \
            echo '== grub-pc theme.txt'; cat /usr/share/live/build/bootloaders/grub-pc/live-theme/theme.txt; \
            echo '== grub-pc grub.cfg'; cat /usr/share/live/build/bootloaders/grub-pc/grub.cfg; } > logs/bootloader-templates.log 2>&1 || true
          ( while sleep 20; do echo "RES $(date +%T) $(df -h / | tail -1 | awk '{print "disk-used="$3" avail="$4}') $(free -m | awk 'NR==2{print "mem-used="$3"M avail="$7"M"}') $(free -m | awk 'NR==3{print "swap-used="$3"M"}')"; done ) &
          os/build.sh 2>&1 | tee logs/iso-build.log
      - name: Collect live-build logs
        if: always()
        run: |
          mkdir -p logs
          cp os/build/chroot.log logs/ 2>/dev/null || true
          cp os/build/*.log logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-logs
          path: logs/
      - name: Checksum
        run: cd os/build && sha256sum ./*.iso | sed 's|\./||' > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tind-iso
          path: |
            os/build/*.iso
            os/build/SHA256SUMS
          retention-days: 30
          compression-level: 0

  boot:
    if: ${{ !contains(github.event.head_commit.message, '[skip iso]') }}
    needs: iso
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tind-iso
          path: iso
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf socat imagemagick
      - name: Boot the ISO (UEFI) and take screenshots
        run: |
          mkdir -p logs shots
          {
            ls -l iso
            [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm
            if [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; echo "KVM: yes"; else ACCEL="-cpu max"; echo "KVM: no (TCG, slow)"; fi
            ISO=$(ls $PWD/iso/*.iso | head -1)
            cp /usr/share/OVMF/OVMF_VARS_4M.fd $PWD/vars.fd
            qemu-system-x86_64 $ACCEL -machine q35 -m 4096 -smp 2 \
              -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
              -drive if=pflash,format=raw,file=$PWD/vars.fd \
              -smbios type=1,product=tind-ci -cdrom "$ISO" -boot d -vga std -display none -serial file:$PWD/logs/serial.log \
              -monitor unix:$PWD/mon.sock,server,nowait -daemonize -pidfile $PWD/qemu.pid
            # early frames: firmware, boot menu, then Plymouth after Enter (function only, no design check)
            for j in $(seq 1 12); do
              sleep 2
              echo "screendump $PWD/shots/e$(printf %02d "$j").ppm" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || true
              sleep 0.5
              [ -f "shots/e$(printf %02d "$j").ppm" ] && convert "shots/e$(printf %02d "$j").ppm" -resize 800x "logs/early-$(printf %02d "$j").png"
            done
            echo "sendkey ret" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || echo "sendkey failed"
            for j in $(seq 13 24); do
              sleep 2
              echo "screendump $PWD/shots/e$(printf %02d "$j").ppm" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || true
              sleep 0.5
              [ -f "shots/e$(printf %02d "$j").ppm" ] && convert "shots/e$(printf %02d "$j").ppm" -resize 800x "logs/early-$(printf %02d "$j").png"
            done
            # Quick Settings panel, dark then light (Super+S). Timed from the self-test marker on the
            # serial log: the guest flips to the light scheme 200 s after it prints it.
            for _ in $(seq 1 180); do grep -q 'TIND-SELFTEST-BEGIN' logs/serial.log 2>/dev/null && break; sleep 2; done
            T0=$(date +%s)
            qs_shot() {
              echo "sendkey esc" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || true; sleep 3
              echo "sendkey meta_l-s" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || true; sleep 4
              echo "screendump $PWD/shots/$1.ppm" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || echo "monitor gone ($1)"
              sleep 1
              [ -f "shots/$1.ppm" ] && convert "shots/$1.ppm" "logs/$1.png"
              echo "sendkey esc" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || true; sleep 2
            }
            settings_shot() {
              # Settings > Appearance is opened by the guest itself (tind-selftest); wait until $2 s after the marker
              sleep $(( $2 - ( $(date +%s) - T0 ) )) || true
              echo "screendump $PWD/shots/$1.ppm" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || echo "monitor gone ($1)"
              sleep 1
              [ -f "shots/$1.ppm" ] && convert "shots/$1.ppm" "logs/$1.png"
            }
            sleep 6
            # leave the overview, open a Terminal with Ctrl+Alt+T and show the plain desktop (dock, bar, window buttons)
            echo "sendkey esc" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || true; sleep 3
            echo "sendkey ctrl-alt-t" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || true; sleep 14
            echo "screendump $PWD/shots/desktop-dark.ppm" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || echo "monitor gone (desktop-dark)"
            sleep 1; [ -f shots/desktop-dark.ppm ] && convert shots/desktop-dark.ppm logs/desktop-dark.png
            qs_shot quickpanel-dark
            settings_shot settings-dark 85
            sleep $(( 215 - ( $(date +%s) - T0 ) )) || true
            echo "screendump $PWD/shots/desktop-light.ppm" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || echo "monitor gone (desktop-light)"
            sleep 1; [ -f shots/desktop-light.ppm ] && convert shots/desktop-light.ppm logs/desktop-light.png
            qs_shot quickpanel-light
            settings_shot settings-light 268
            for i in $(seq 1 14); do
              sleep 45
              # leave the overview once so the later screenshots show the plain desktop
              [ "$i" = 5 ] && echo "sendkey esc" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || true
              echo "screendump $PWD/shots/t$(printf %02d "$i").ppm" | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || echo "monitor gone at $i"
              sleep 1
              if [ -f "shots/t$(printf %02d "$i").ppm" ]; then convert "shots/t$(printf %02d "$i").ppm" "logs/boot-t$(printf %02d "$i").png"; fi
            done
            echo quit | socat - UNIX-CONNECT:$PWD/mon.sock >/dev/null || true
            ls -l logs
          } 2>&1 | tee logs/boot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-logs
          path: logs/

  publish-logs:
    # Actions log downloads are not reachable from Claude's workspace, so push the logs to a branch.
    needs: [packages, iso, boot]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-logs'
          path: collected
          merge-multiple: true
      - name: Push logs to ci-logs branch
        env:
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN: ${{ github.run_id }}
          RESULTS: "packages=${{ needs.packages.result }} iso=${{ needs.iso.result }} boot=${{ needs.boot.result }}"
        run: |
          set -eu
          git clone --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out 2>/dev/null \
            || { git init -q out; git -C out checkout -q -b ci-logs; git -C out remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
          d="out/${GH_REF//\//_}"
          rm -rf "$d"; mkdir -p "$d"
          for f in collected/*.log; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            tail -n 400 "$f" > "$d/$b.tail"
            gzip -9 -c "$f" > "$d/$b.gz"
          done
          cp collected/*.png "$d/" 2>/dev/null || true
          printf 'ref: %s\nsha: %s\nrun: %s\nresults: %s\n' "$GH_REF" "$GH_SHA" "$GH_RUN" "$RESULTS" > "$d/STATUS"
          cd out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "logs for $GH_REF $GH_SHA ($RESULTS)" || true
          git push origin ci-logs
